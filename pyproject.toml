[project]
name = "hbservice"
version = "0.1.0"
description = "Hotel room and booking management service"
authors = [
    {name = "acheremisin",email = "alexeycheremisin.pochta@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django (>=5.2.8,<6.0.0)",
    "djangorestframework (>=3.14.0,<4.0.0)",
    "psycopg2-binary (>=2.9.0,<3.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "pydantic-settings (>=2.0.0,<3.0.0)",
]

[dependency-groups]
dev = [
    "pytest (>=7.0.0,<8.0.0)",
    "pytest-cov (>=4.0.0,<5.0.0)",
    "ruff (>=0.1.0,<0.2.0)",
    "pre-commit (>=3.0.0,<4.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 88
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.per-file-ignores]
"*/migrations/*.py" = ["F401"]
"*/settings/*.py" = ["F403"]
"tests/*.py" = ["S101", "PLR2004"]

[tool.ruff.isort]
known-first-party = ["hbservice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--cov=hbservice",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-branch",
]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning"
]
markers = [
    "hotels: mark test as hotels app test",
    "bookings: mark test as bookings app test",
    "slow: marks tests as slow",
    "integration: integration tests"
]


[tool.coverage.run]
source = ["src/hbservice"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/settings/*",
    "*/__init__.py",
    "*/admin.py",
    "*/apps.py",
    "*/manage.py",
    "*/urls.py",
    "*/wsgi.py"
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __str__",
    "def __repr__",
    "if self.debug",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "pass"
]
show_missing = true
